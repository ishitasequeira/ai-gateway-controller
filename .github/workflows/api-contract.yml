name: API contract

# API contract compatibility checks. Compares CRDs in a pull
# request with an immutable baseline commit and fails on breaking changes.
#
# The reusable workflows are pinned to the "latest" tag of api-contract-tests
# (v2.2.0 when this file was added), so new releases are adopted without a
# change here. The working group moves `latest` with each release. See
# https://github.com/red-hat-data-services/api-contract-tests/blob/main/docs/releasing.md
# before changing the pin.
#
# Canonical CRDs: AIGuardrail (aigateway.opendatahub.io), ExternalModel and
# ExternalProvider (inference.opendatahub.io). No OpenAPI documents are
# checked in; coverage uses .rhoai/contracts.yaml with spec.contracts: [] (CRD-only).
#
# Baseline: 4fde3ae0af2d21debb8bfc18b3948149ed705e57 — merge base of the
# downstream rhoai-3.6 release line and this repository's main branch, as
# recorded in data/release-baselines/3.6.json in api-contract-tests (generated
# 2026-11-09). No GA release tag exists for this repository. Moving the baseline
# forward needs approval from someone other than the author.
#
# Runs on every pull request to main (no path filter) so new CRD manifests are
# picked up by the coverage job.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Two CRD globs require two provider-crd-check jobs (one glob per callee). Both
# jobs upload the same artifact name; upload-artifact v4 merges those uploads
# within one workflow run (see data-connect-hub for the same pattern).
jobs:
  crd-contract-inference:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/crd/bases/*.yaml
      baseline-refs: 4fde3ae0af2d21debb8bfc18b3948149ed705e57 # RHOAI 3.6 release baseline
      mode: enforce

  crd-contract-aigateway:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/self/crd/bases/*.yaml
      baseline-refs: 4fde3ae0af2d21debb8bfc18b3948149ed705e57 # RHOAI 3.6 release baseline
      mode: enforce

  api-contract-coverage:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-coverage-check.yml@latest
    with:
      contract-set: .rhoai/contracts.yaml
      crd-globs: >-
        config/crd/bases/*.yaml
        config/self/crd/bases/*.yaml
      # Envtest fixtures copied from other projects — not CRDs this repository ships.
      crd-exclude-globs: test/envtest/testdata/crds/*.yaml
      baseline-refs: 4fde3ae0af2d21debb8bfc18b3948149ed705e57 # RHOAI 3.6 release baseline
      yq-version: "4.45.1"
      mode: enforce